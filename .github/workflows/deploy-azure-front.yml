# CI/CD do front AuroraPet (Expo web) -> Azure App Service
# Gerado por criar-webapp-front.sh (Sprint 4). Push na branch = build + deploy.
# Pull request = só build (CI), sem deploy.
#
# Configuração usada (gravada pelo script no repositório):
#   secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONT  -> credencial de deploy do Web App
#   vars.FRONT_APP_NAME                         -> nome do Web App
#   vars.AURORAPET_API_URL          (opcional)  -> URL da API AuroraPet (/api); sem ela usa a do app.config.js
# A configuração pública do Firebase já está no app.config.js.

name: CI/CD Front - Azure Web App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; um novo push espera o anterior terminar
concurrency:
  group: deploy-front-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (Expo web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web (expo export)
        run: npx expo export --platform web
        env:
          CI: 'true'
          EXPO_PUBLIC_API_URL: ${{ vars.AURORAPET_API_URL }}

      - name: Validar saída do build
        run: test -f dist/index.html && du -sh dist

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: front-dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy no Azure Web App
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Baixar build
        uses: actions/download-artifact@v4
        with:
          name: front-dist
          path: dist

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.FRONT_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONT }}
          package: dist
